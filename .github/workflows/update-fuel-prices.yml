name: Publicar sitio con precios del día
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Actualizar precios zonales
        run: node scripts/update-fuel-prices.mjs || echo "Se publica la última copia de precios disponible"
      - name: Pruebas
        run: node --test js/*.test.mjs route-map.test.js scripts/*.test.mjs
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
