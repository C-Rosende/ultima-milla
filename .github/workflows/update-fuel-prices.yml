name: Actualizar precios zonales
on:
  schedule:
    - cron: '17 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: fuel-prices
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/update-fuel-prices.mjs
      - name: Publicar copia fechada
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fuel-prices.json
          git commit -m 'data: actualizar precios zonales' || exit 0
          git push
      - name: Reconstruir GitHub Pages con la copia nueva
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages/builds"
